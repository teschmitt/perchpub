# Traefik file-provider dynamic config (loaded via
# --providers.file.directory=/etc/traefik/dynamic). Carries ONLY the mTLS
# edge wiring. The https-redirect middleware is intentionally a @docker
# middleware (defined on the Traefik service in docker-compose.prod.yml) so
# the existing bare `middlewares=https-redirect` labels in docker-compose.yml
# resolve to https-redirect@docker.
#
# Hardcodes api.perchpub.net and the device-CA container paths. If DOMAIN
# ever changes, update the router rule below.

tls:
  options:
    mtls:
      # Stations MUST present a client certificate, verified against the
      # device CA. Reaching the backend's /api/v1/upload/ over any other
      # entrypoint leaves the cert header attacker-controlled — entrypoint
      # isolation is the trust boundary (see app/api/deps.py docstring).
      clientAuth:
        clientAuthType: RequireAndVerifyClientCert
        # Both files: device leaf certs are issued by the step-ca
        # intermediate (backend verifies verify_directly_issued_by(intermediate)
        # in deps.py); including the root lets Traefik build the full chain
        # whether or not the station presents the intermediate in the
        # handshake. VERIFY at first apply: if the handshake fails with
        # "unknown certificate authority", confirm which CA actually signs
        # device leaves and adjust this list (see Task 3 Step 4).
        caFiles:
          - /certs/root_ca.crt
          - /certs/intermediate_ca.crt
      minVersion: VersionTLS12

http:
  middlewares:
    pass-client-cert:
      # pem: true emits the verified leaf as X-Forwarded-Tls-Client-Cert,
      # URL-encoded with the PEM armor stripped. The backend decodes with
      # urllib.parse.unquote (NOT unquote_plus) and re-attaches the armor —
      # contract documented in app/api/deps.py:113-127.
      passTLSClientCert:
        pem: true

  routers:
    mtls-upload:
      rule: "Host(`api.perchpub.net`) && PathPrefix(`/api/v1/upload/`)"
      entryPoints:
        - mtls
      service: backend-mtls
      middlewares:
        - pass-client-cert
      tls:
        certResolver: le
        options: mtls

    mtls-enrollment-renew:
      # Unattended certificate renewal: the station POSTs a CSR over its
      # existing key and authenticates with its current leaf — mTLS IS the
      # credential, so the route must live on this entrypoint. Mirrors
      # mtls-upload: same client-auth against the device CA, and
      # pass-client-cert forwards the verified leaf that
      # get_current_station/renew resolve the station from. The exact-Path
      # rule keeps the rest of /api/v1/enrollment/ (create/confirm) OFF the
      # mTLS entrypoint — those stay operator/QR-gated on :443. On the :443
      # catch-all this path is still forwarded, but Traefik strips inbound
      # X-Forwarded-Tls-Client-Cert from untrusted peers (no
      # forwardedHeaders.trustedIPs configured), so it dead-ends in the
      # backend's generic 401 — same posture as /api/v1/upload/.
      rule: "Host(`api.perchpub.net`) && Path(`/api/v1/enrollment/renew`)"
      entryPoints:
        - mtls
      service: backend-mtls
      middlewares:
        - pass-client-cert
      tls:
        certResolver: le
        options: mtls

    mtls-classify-task:
      # After uploading, the station polls GET /api/v1/classify-task/{id} for
      # the classification result. Its outbound allowlist permits only the mTLS
      # upload base (:8443) — the same boundary as upload — so the poll arrives
      # on this entrypoint, NOT the :443 public edge. Without this router
      # Traefik's no-route handler 404s every poll and the station treats it as
      # terminal (classify.lost). Mirrors mtls-upload exactly: same backend-mtls
      # service, same RequireAndVerifyClientCert client-auth against the device
      # CA (tls.options: mtls), so only an enrolled station reaches the backend.
      # pass-client-cert forwards the verified leaf so the station identity is
      # available to the backend for any future per-station scoping (the GET
      # handler is unscoped today — see app/api/routes/classify_tasks.py).
      rule: "Host(`api.perchpub.net`) && PathPrefix(`/api/v1/classify-task/`)"
      entryPoints:
        - mtls
      service: backend-mtls
      middlewares:
        - pass-client-cert
      tls:
        certResolver: le
        options: mtls

  services:
    backend-mtls:
      loadBalancer:
        servers:
          - url: "http://backend:8000"
