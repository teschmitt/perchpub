services:

  # This override file is intended for local development only.
  # Production composes docker-compose.yml + docker-compose.prod.yml (the
  # prod overlay), without this override.
  #
  # Dev runs no Traefik (FU-11). Devs and tests hit each service on its
  # mapped host port; the prod stack runs an in-stack Traefik edge per
  # docker-compose.prod.yml + deployment.md.

  db:
    restart: "no"
    env_file:
      - .env.dev
    ports:
      - "5432:5432"

  adminer:
    restart: "no"
    env_file:
      - .env.dev
    ports:
      - "8080:8080"

  prestart:
    env_file:
      - .env.dev

  backend:
    restart: "no"
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    build:
      context: ./backend
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/htmlcov
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
      # Reach the in-stack Minio over the compose network (plain HTTP). Overrides
      # the host-side GARAGE_ENDPOINT (localhost:9102) from .env.dev.
      GARAGE_ENDPOINT: "minio:9000"
      GARAGE_USE_TLS: "False"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    env_file:
      - .env.dev
    environment:
      GARAGE_ENDPOINT: "minio:9000"
      GARAGE_USE_TLS: "False"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # `command:` (huey_consumer) now lives in the base docker-compose.yml so
    # prod gets it too; no override needed here.

  mailcatcher:
    image: schickling/mailcatcher
    env_file:
      - .env.dev
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      # Dev SSR reaches the backend over the compose network.
      - INTERNAL_API_URL=http://backend:8000
    env_file:
      - .env.dev

  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
    ipc: host
    depends_on:
      - backend
      - frontend
    env_file:
      - .env.dev
    environment:
      # The Playwright webServer boots the SSR app, which reaches the backend
      # over the compose network.
      - INTERNAL_API_URL=http://backend:8000
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/blob-report
      - ./frontend/test-results:/app/test-results
    ports:
      - 9323:9323

  redis:
    restart: always
    env_file:
      - .env.dev
    ports:
      - 6379:6379

  step-ca:
    env_file:
      - .env.dev
    ports:
      - 9000:9000

  step-ca-provisioner-init:
    env_file:
      - .env.dev

  # Local S3 (replaces decommissioned Hetzner; prod uses OVH). Ephemeral: data
  # lives in the container, so minio-init recreates the bucket + reseeds the
  # model on every `up`. Host ports are distinct from the integration-test Minio
  # (9100/9101 in docker-compose.test.yml) so a dev stack and an integration run
  # can coexist.
  minio:
    image: minio/minio:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${GARAGE_KEY_ID}
      MINIO_ROOT_PASSWORD: ${GARAGE_SECRET}
    command: server /data --console-address ":9001"
    ports:
      - "9102:9000"
      - "9103:9001"

  # One-shot: wait for Minio, create the dev bucket, seed the classifier model +
  # labels (bind-mounted from ./classification) under the keys the app expects
  # (CLASSIFICATION_MODEL_OBJECT_NAME / CLASSIFICATION_LABELS_OBJECT_NAME), then
  # exit 0. backend + worker depend on this completing.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    env_file:
      - .env.dev
    volumes:
      - ./classification:/classification:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        attempts=0
        until mc alias set dev http://minio:9000 "$$GARAGE_KEY_ID" "$$GARAGE_SECRET" >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ $$attempts -ge 30 ]; then
            echo "minio not ready after 30 attempts" >&2
            exit 1
          fi
          sleep 1
        done
        mc mb "dev/$$GARAGE_BUCKET_NAME" --ignore-existing
        mc cp /classification/classify.tflite "dev/$$GARAGE_BUCKET_NAME/$$CLASSIFICATION_MODEL_OBJECT_NAME"
        mc cp /classification/probability-labels-en.txt "dev/$$GARAGE_BUCKET_NAME/$$CLASSIFICATION_LABELS_OBJECT_NAME"

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
