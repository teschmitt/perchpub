services:

  # This override file is intended for local development only.
  # Production should use only docker-compose.yml (and any prod-specific
  # files like docker-compose.traefik.yml), without this override.
  #
  # Dev runs no Traefik (FU-11). Devs and tests hit each service on its
  # mapped host port; the prod stack is fronted by a separately-deployed
  # Traefik per docker-compose.traefik.yml + deployment.md.

  db:
    restart: "no"
    env_file:
      - .env.dev
    ports:
      - "5432:5432"

  adminer:
    restart: "no"
    env_file:
      - .env.dev
    ports:
      - "8080:8080"

  prestart:
    env_file:
      - .env.dev

  backend:
    restart: "no"
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    build:
      context: ./backend
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/htmlcov
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"

  worker:
    env_file:
      - .env.dev
    command:
      - huey_consumer.py
      - app.tasks.huey_client
      - -k
      - process
      - -w
      - "4"

  mailcatcher:
    image: schickling/mailcatcher
    env_file:
      - .env.dev
    ports:
      - "1080:1080"
      - "1025:1025"

  frontend:
    restart: "no"
    ports:
      - "5173:80"
    env_file:
      - .env.dev
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - NODE_ENV=development

  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env.dev
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/blob-report
      - ./frontend/test-results:/app/test-results
    ports:
      - 9323:9323

  redis:
    restart: always
    env_file:
      - .env.dev
    ports:
      - 6379:6379

  step-ca:
    env_file:
      - .env.dev
    ports:
      - 9000:9000

  step-ca-provisioner-init:
    env_file:
      - .env.dev

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
