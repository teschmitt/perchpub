services:

  db:
    image: postgres:18
    restart: always
    # `$$POSTGRES_USER` / `$$POSTGRES_DB` resolve at container runtime from
    # env_file injection, not from compose-parse-time substitution — keeps
    # the env_file the single source of truth.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    env_file:
      - .env.prod
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    env_file:
      - .env.prod
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: ./backend
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env.prod
    environment:
      # Override .env.{dev,prod}'s host-side `localhost` with the docker
      # service hostname so containers reach Postgres via the docker network.
      - POSTGRES_SERVER=db

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
      redis:
        condition: service_started
      step-ca-provisioner-init:
        condition: service_completed_successfully
    env_file:
      - .env.prod
    volumes:
      # Two narrow subpath mounts off the step-ca volume (FU-13). The JWK
      # file is the perchpub provisioner's private key; certs/ holds the
      # public root + intermediate CA certs the backend needs for OTT
      # signing and device-cert verification. Keep secrets/ (root and
      # intermediate CA keys, root password) and the CA's db/ off the
      # backend's filesystem.
      - type: volume
        source: step-ca
        target: /home/step-ca/backend-provisioner.jwk
        read_only: true
        volume:
          subpath: backend-provisioner.jwk
      - type: volume
        source: step-ca
        target: /home/step-ca/certs
        read_only: true
        volume:
          subpath: certs
    environment:
      # Override .env.{dev,prod}'s host-side `localhost` with the docker
      # service hostname so containers reach Postgres via the docker network.
      - POSTGRES_SERVER=db
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      # Rate-limit middlewares (WI-14). Defaults use the connecting client IP
      # (the dev override has no upstream proxy; prod runs Traefik at the edge).
      # If a CDN is added in front, set sourcecriterion.ipstrategy.depth=1.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-login-rl.ratelimit.average=10
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-login-rl.ratelimit.period=1m
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-login-rl.ratelimit.burst=20
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-recovery-rl.ratelimit.average=3
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-recovery-rl.ratelimit.period=1m
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-recovery-rl.ratelimit.burst=5
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-signup-rl.ratelimit.average=3
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-signup-rl.ratelimit.period=1m
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-signup-rl.ratelimit.burst=5

      # HTTP catch-all: redirect to HTTPS in prod; dev override stubs
      # https-redirect to a no-op so the http path-specific routers below still
      # apply the rate limit when hit on port 80.
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

      # HTTPS catch-all (prod terminator).
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Rate-limited routers. Path/PathPrefix rules are longer than the
      # catch-all rule above, so Traefik's default rule-length priority routes
      # matching requests here. Each protected path gets both an HTTP and an
      # HTTPS router — HTTPS for prod, HTTP for dev (where 443 isn't exposed
      # and https-redirect is stubbed to a no-op).
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-http.rule=Host(`api.${DOMAIN?Variable not set}`) && Path(`/api/v1/login/access-token`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-http.middlewares=${STACK_NAME?Variable not set}-login-rl,https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-https.rule=Host(`api.${DOMAIN?Variable not set}`) && Path(`/api/v1/login/access-token`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-login-https.middlewares=${STACK_NAME?Variable not set}-login-rl

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-http.rule=Host(`api.${DOMAIN?Variable not set}`) && (PathPrefix(`/api/v1/password-recovery/`) || Path(`/api/v1/reset-password/`))
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-http.middlewares=${STACK_NAME?Variable not set}-recovery-rl,https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-https.rule=Host(`api.${DOMAIN?Variable not set}`) && (PathPrefix(`/api/v1/password-recovery/`) || Path(`/api/v1/reset-password/`))
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-recovery-https.middlewares=${STACK_NAME?Variable not set}-recovery-rl

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-http.rule=Host(`api.${DOMAIN?Variable not set}`) && Path(`/api/v1/users/signup`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-http.middlewares=${STACK_NAME?Variable not set}-signup-rl,https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-https.rule=Host(`api.${DOMAIN?Variable not set}`) && Path(`/api/v1/users/signup`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-signup-https.middlewares=${STACK_NAME?Variable not set}-signup-rl

  worker:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    # The image's default CMD is `fastapi run` (the API server). The worker
    # must instead run the Huey consumer — otherwise prod (which composes this
    # file + docker-compose.prod.yml, WITHOUT the dev override) silently boots
    # a second API server, nothing drains the Redis queue, and uploads pile up
    # forever at ClassifyTask.status="Prepared". `-k process -w 4` mirrors the
    # dev override so behaviour is identical across environments.
    command:
      - huey_consumer.py
      - app.tasks.huey_client
      - -k
      - process
      - -w
      - "4"
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
      backend:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      # Override .env.{dev,prod}'s host-side `localhost` with the docker
      # service hostname so containers reach Postgres via the docker network.
      - POSTGRES_SERVER=db

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
    env_file:
      - .env.prod
    environment:
      # Server-side data access over the internal network (BFF). The browser is
      # same-origin and never calls the backend cross-origin.
      - INTERNAL_API_URL=http://backend:8000
      # adapter-node sits behind Traefik: trust the forwarded proto/host and pin
      # ORIGIN so form-action CSRF/Origin checks pass.
      - ORIGIN=https://${DOMAIN?Variable not set}
      - PROTOCOL_HEADER=X-Forwarded-Proto
      - HOST_HEADER=X-Forwarded-Host
      # Absolute public base for OG/share URLs.
      - PUBLIC_SITE_URL=https://${DOMAIN?Variable not set}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=3000

      # Public app serves on the apex Host(${DOMAIN}) (replaces the template's
      # dashboard.${DOMAIN}). http (apex + www) → https.
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`${DOMAIN?Variable not set}`) || Host(`www.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # www.${DOMAIN} → apex redirect (its own LE cert via the same resolver).
      # `$${1}` escapes compose substitution so Traefik receives the literal
      # regex backreference `${1}`.
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-www-redirect.redirectregex.regex=^https?://www\.(.+)
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-www.rule=Host(`www.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-www.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-www.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-www.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-www.middlewares=${STACK_NAME?Variable not set}-www-redirect

  # blob-storage:
  #   image: dxflrs/garage:v2.1.0
  #   restart: unless-stopped
  #   networks:
  #     - default
  #   env_file:
  #     - .env.prod
  #   volumes:
  #     - ./storage/garage.toml:/etc/garage.toml
  #     - garage:/var/lib/garage

  redis:
    image: redis:8-alpine
    networks:
      - traefik-public
      - default
    env_file:
      - .env.prod
    volumes:
      - redis:/data

  step-ca:
    image: smallstep/step-ca:0.29.0
    restart: always
    networks:
      - default
    env_file:
      - .env.prod
    volumes:
      - step-ca:/home/step
    environment:
      - DOCKER_STEPCA_INIT_NAME=PerchPub CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,localhost
      - DOCKER_STEPCA_INIT_ADDRESS=:9000
      - DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT=true
      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=admin
      # Pin the admin password to the env file at first init (FU-19) so
      # `step-ca-provisioner-init` can authenticate without scraping the
      # auto-generated value from container logs. No-op for already-
      # initialized volumes; only takes effect on a fresh `step-ca` volume.
      - DOCKER_STEPCA_INIT_PASSWORD=${STEP_CA_ADMIN_PASSWORD?Variable not set}

  # Idempotent init: ensures the backend-device-enrollment JWK provisioner
  # exists on the running CA, then writes the decrypted private JWK to the
  # shared step-ca volume so the backend can read it at STEP_CA_JWK_PATH.
  # Exits 0 once the JWK file is in place; backend depends_on this service
  # completing successfully before booting.
  step-ca-provisioner-init:
    image: smallstep/step-ca:0.29.0
    networks:
      - default
    depends_on:
      step-ca:
        condition: service_healthy
    volumes:
      - step-ca:/home/step
    env_file:
      - .env.prod
    environment:
      - STEPPATH=/home/step
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        PWFILE=$$(mktemp)
        trap 'rm -f "$$PWFILE"' EXIT
        printf '%s' "$$STEP_CA_ADMIN_PASSWORD" > "$$PWFILE"

        if step ca provisioner list \
            --ca-url=https://step-ca:9000 \
            --root=/home/step/certs/root_ca.crt \
          | jq -e '.[] | select(.name=="backend-device-enrollment")' >/dev/null; then
          echo "provisioner backend-device-enrollment already exists; skipping create"
        else
          step ca provisioner add backend-device-enrollment --type JWK --create \
            --ca-url=https://step-ca:9000 \
            --root=/home/step/certs/root_ca.crt \
            --admin-subject=step --admin-provisioner=admin \
            --admin-password-file="$$PWFILE" \
            --password-file="$$PWFILE"
          echo "provisioner backend-device-enrollment created"
        fi

        # rm -f is load-bearing on subsequent runs: the chmod 0440 below
        # leaves the file owner-read-only, so a bare `> file` redirect
        # fails with EACCES. Recreating from scratch each run is safe —
        # the source-of-truth is the encryptedKey in the CA db.
        rm -f /home/step/backend-provisioner.jwk
        step ca provisioner list \
            --ca-url=https://step-ca:9000 \
            --root=/home/step/certs/root_ca.crt \
          | jq -r '.[] | select(.name=="backend-device-enrollment") | .encryptedKey' \
          | step crypto jwe decrypt --password-file="$$PWFILE" \
          > /home/step/backend-provisioner.jwk
        chmod 0440 /home/step/backend-provisioner.jwk
        echo "wrote /home/step/backend-provisioner.jwk"
    restart: "no"

volumes:
  pgdata:
  redis:
  step-ca:


networks:
  traefik-public:
    external: true
