[project]
name = "app"
version = "0.1.0"
description = ""
license = "AGPL-3.0-or-later"
requires-python = ">=3.12.7,<3.13"
dependencies = [
    "alembic<2.0.0,>=1.12.1",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.3.0",
    "cryptography>=42.0.0,<46.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "emails<1.0,>=0.6",
    "fastapi[standard]<1.0.0,>=0.114.2",
    "httpx>=0.25.1,<1.0.0",
    "huey>=2.5.5",
    "jinja2<4.0.0,>=3.1.4",
    # "jwt>=1.4.0",
    "minio>=7.2.20",
    "opencv-python-headless>=4.12.0.88",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pydantic>2.0",
    "pyjwt<3.0.0,>=2.8.0",
    "python-multipart>=0.0.7,<1.0.0",
    "redis>=7.1.0",
    "sentry-sdk[fastapi]==2.58.0",
    "sqlmodel<1.0.0,>=0.0.21",
    "tenacity<9.0.0,>=8.2.3",
    "tensorflow>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff>=0.16.0,<1.0.0",
    "prek>=0.2.24,<1.0.0",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = ["tensorflow", "tensorflow.*", "huey", "huey.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
    "B904", # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "integration: cross-process tests against real services; opt-in via scripts/integration-test.sh",
]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
