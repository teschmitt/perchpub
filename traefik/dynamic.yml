# Traefik file-provider config (mTLS-05).
#
# Carries:
#   - mTLS TLS options (RequireAndVerifyClientCert against the step-ca
#     intermediate CA — the issuer of every device leaf signed via the
#     backend-device-enrollment JWK provisioner).
#   - passTLSClientCert middleware injecting the verified leaf into
#     X-Forwarded-Tls-Client-Cert (URL-encoded PEM, what
#     app/api/deps.py:get_current_station expects).
#   - a router on the dedicated `mtls` entrypoint mapping device traffic
#     (PathPrefix /api/v1/upload) to the backend service.
#
# The Host predicate is intentionally omitted: the mtls entrypoint is the
# trust boundary (RequireAndVerifyClientCert applies to the listener
# itself), and the entrypoint is dedicated to device traffic. A docker-
# label-based router on `https` covers other paths under the same hostname
# without requiring a client cert.
#
# This file is mounted read-only into the dev `proxy` and the prod
# `traefik` services. The docker provider continues to publish the
# WI-14 rate-limit middlewares + http/https routers from the backend
# service labels (see docker-compose.yml). FU-11 keeps the docker
# provider broken in dev, so dev verification of the file-provider
# routes uses the proxy directly on :8443.

tls:
  options:
    # `default` is what Traefik's TLS manager applies to every handshake
    # whose SNI doesn't match a more specific named option. We register
    # mTLS as default rather than under the `deviceMtls` name because
    # router-level tls.options is keyed off the rule's Host predicate
    # matching the connection SNI exactly — too brittle (devices dial
    # `api.${DOMAIN}`, but in dev and behind --resolve / mTLS-09 we want
    # this to work for any SNI a station happens to use).
    #
    # This is safe because the mtls entrypoint (port 8443) is dedicated
    # to device traffic. In prod the standalone frontend / dashboard /
    # adminer routers terminate on the `https` entrypoint (port 443)
    # using their own certs and routers; they never reach :8443 and
    # therefore never see this default. In dev FU-11 keeps the docker
    # provider broken, so nothing else terminates TLS through this proxy
    # anyway.
    default:
      clientAuth:
        caFiles:
          - /etc/traefik/step-ca/certs/intermediate_ca.crt
        clientAuthType: RequireAndVerifyClientCert

http:
  middlewares:
    pass-tls-client-cert:
      passTLSClientCert:
        pem: true

  routers:
    backend-mtls-upload:
      # No Host predicate: the `default` TLS options (above) enforce the
      # client cert requirement at handshake, independent of SNI. The
      # mtls entrypoint is dedicated to device traffic; any matching
      # /api/v1/upload* request that survives the handshake routes here.
      rule: PathPrefix(`/api/v1/upload`)
      entryPoints:
        - mtls
      service: backend-mtls
      middlewares:
        - pass-tls-client-cert
      # Empty tls: marks the router TLS-terminating so it picks up
      # connections on the mtls entrypoint. Per-router tls.options is
      # SNI-keyed and brittle for our case; we keep `default` global.
      tls: {}

  services:
    backend-mtls:
      loadBalancer:
        servers:
          - url: http://backend:8000
